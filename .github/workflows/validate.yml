name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  project:
    name: Tests and reproducible build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run validate:marketplace
      - run: git diff --exit-code -- dist/thermomatrix-card.js

  marketplace:
    name: Marketplace/HACS
    runs-on: ubuntu-latest
    steps:
      - name: Marketplace/HACS validation
        uses: hacs/action@main
        with:
          category: plugin
